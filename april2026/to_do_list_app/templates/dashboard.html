{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<div class="row justify-content-center py-4">
    <div class="table-responsive-md">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-bold fs-4">Task :</span> 
                <a href="{{ url_for('home.add_to_do_list') }}" class="btn btn-primary">Add</a>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 10%;">#</th>
                            <th scope="col" style="width: 70%;">Description</th>
                            <th scope="col" style="width: 20%;">Completed</th>
                        </tr>
                    </thead>
                        
                    <tbody>
                        {% if tasks %}
                            {% for task in tasks %}
                                <tr>
                                    <td>{{ loop.index }}</td>
                                    <td class="text-break" style="max-width: 300px;">{{ task[1] }}</td>
                                    <td class="text-center">
                                        <input type="checkbox"
                                        onchange="toggleTask({{ task[0] }})"
                                        {% if task[2] %}checked{% endif %}>
                                    </td>
                                    <td class="text-center">
                                        <form action="/delete/{{ task[0] }}" method="POST" style="display:inline;">
                                            <button class="btn btn-danger btn-sm">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                            {% endfor %}
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
function toggleTask(taskId) {
    fetch(`/toggle/${taskId}`, {
        method: "POST"
    });
}
</script>

{% endblock %}
